<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050814">
<title>Sleepy Pug v3</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#050814;color:#fff;
  font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:none
}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom))}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.panel{
  background:rgba(8,12,25,.80);border:1px solid rgba(255,255,255,.17);border-radius:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(12px)
}
.score{justify-self:start;min-width:110px;padding:10px 13px;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.score .star{font-size:29px}.score b{font-size:22px;line-height:1}.score small{grid-column:2;font-size:10px;letter-spacing:.08em;color:#b9dfff;font-weight:900}
.timer{min-width:145px;padding:10px 13px 9px;text-align:center}
.timer .row{display:flex;justify-content:center;align-items:center;gap:8px;font-size:24px;font-weight:900}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:7px;border:1px solid rgba(255,255,255,.08)}
.bar>div{height:100%;width:100%;transform-origin:left center;background:linear-gradient(90deg,#48a7ff,#64d6ff,#8cf2b2)}
.houses{justify-self:end;min-width:110px;padding:9px 11px;text-align:center}
.houses .icons{font-size:20px;letter-spacing:2px}.houses small{display:block;margin-top:2px;font-size:10px;color:#b9dfff;font-weight:900;letter-spacing:.08em}
.tip{
  position:absolute;left:50%;transform:translateX(-50%);bottom:108px;width:min(430px,88vw);
  text-align:center;padding:10px 15px;border-radius:999px;background:rgba(8,12,25,.58);
  backdrop-filter:blur(10px);font-size:12px;font-weight:800;transition:opacity .35s
}
.pause,.sound{
  pointer-events:auto;position:absolute;bottom:max(20px,env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
  background:rgba(8,12,25,.8);color:white;font-size:24px;font-weight:900;backdrop-filter:blur(12px)
}
.pause{left:18px}.sound{right:18px}
.mode{
  position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));
  min-width:220px;padding:11px 18px;text-align:center;font-size:17px;font-weight:900
}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:rgba(3,6,15,.68);backdrop-filter:blur(12px)}
.hidden{display:none}
.card{width:min(360px,92vw);padding:26px;border-radius:28px;background:rgba(10,14,28,.94);border:1px solid rgba(255,255,255,.17);text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.card .emoji{font-size:56px}.card h1{margin:8px 0 6px;font-size:26px}.card p{margin:0 0 20px;opacity:.82}
.btn{pointer-events:auto;border:0;border-radius:18px;padding:13px 20px;background:white;color:#0b1020;font-weight:900;font-size:15px}
@media(max-width:420px){
  .score,.houses{min-width:94px;padding:8px 9px}.score b{font-size:20px}.score .star{font-size:25px}
  .timer{min-width:124px}.timer .row{font-size:20px}.houses .icons{font-size:17px}
}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
  <div class="top">
    <div class="panel score"><div class="star">⭐</div><b id="score">0</b><small>PUNKTE</small></div>
    <div class="panel timer"><div class="row">⏱ <span id="time">15.0</span></div><div class="bar"><div id="timeFill"></div></div></div>
    <div class="panel houses"><div class="icons">🏠🏠🏠</div><small>HÄUSER</small></div>
  </div>
  <div class="tip" id="tip">Tippe die fliegenden Dinge an, bevor sie den Mops erreichen.</div>
  <button class="pause" id="pauseBtn">Ⅱ</button>
  <div class="panel mode">❤️ 🐶 Mops‑Modus <span style="font-size:9px;opacity:.45">v3</span></div>
  <button class="sound" id="soundBtn">🔊</button>
</div>

<div id="gameOver" class="overlay hidden">
  <div class="card">
    <div class="emoji">😳</div>
    <h1>Der Mops ist wach!</h1>
    <p>Du hast <b id="finalScore">0</b> Punkte geschafft.</p>
    <button class="btn" id="restartBtn">Nochmal spielen</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const mount=document.getElementById('game');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const timeFill=document.getElementById('timeFill');
const tipEl=document.getElementById('tip');
const gameOverEl=document.getElementById('gameOver');
const finalScoreEl=document.getElementById('finalScore');
const pauseBtn=document.getElementById('pauseBtn');
const soundBtn=document.getElementById('soundBtn');

let score=0, deadline=15, running=true, paused=false, soundOn=true;
let last=performance.now(), spawnIn=.75;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050814);
scene.fog=new THREE.FogExp2(0x050814,.012);

const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,100);
camera.position.set(0,3.0,12.8);
camera.lookAt(0,-.28,0);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
mount.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x5d6b95,1.0));
const key=new THREE.DirectionalLight(0xffd2a3,4.2); key.position.set(4,6,5); key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key);
const rim=new THREE.DirectionalLight(0x739aff,2.3); rim.position.set(-5,4,-4); scene.add(rim);
const warm=new THREE.PointLight(0xffa85b,15,10,2); warm.position.set(3.2,2.0,3.5); scene.add(warm);

// stars
const starGeo=new THREE.BufferGeometry();
const starCount=800;
const positions=new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){
  const r=22+Math.random()*32, a=Math.random()*Math.PI*2, y=-14+Math.random()*28;
  positions[i*3]=Math.cos(a)*r; positions[i*3+1]=y; positions[i*3+2]=Math.sin(a)*r;
}
starGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:.055,sizeAttenuation:true}));
scene.add(stars);

// subtle platform shadow
const shadowDisc=new THREE.Mesh(new THREE.CircleGeometry(3.9,64),new THREE.MeshBasicMaterial({color:0x05070e,transparent:true,opacity:.5}));
shadowDisc.rotation.x=-Math.PI/2; shadowDisc.position.set(0,-2.05,.1); shadowDisc.scale.set(1.35,.62,1); scene.add(shadowDisc);

// cushion, smaller and lower like reference
const cushion=new THREE.Group();
cushion.position.set(0,-1.72,.1);
cushion.scale.set(.66,.66,.66);
scene.add(cushion);

const cushionMat=new THREE.MeshStandardMaterial({color:0xd7b78c,roughness:.98});
const cbase=new THREE.Mesh(new THREE.SphereGeometry(1,48,26),cushionMat);
cbase.scale.set(2.55,.34,1.62); cbase.castShadow=true; cbase.receiveShadow=true; cushion.add(cbase);

const edge=new THREE.Mesh(new THREE.TorusGeometry(1.0,.05,10,64),new THREE.MeshStandardMaterial({color:0xa98663,roughness:1}));
edge.scale.set(2.5,.55,1.55); edge.rotation.x=Math.PI/2; edge.position.y=.02; cushion.add(edge);

// pug materials
const fur=new THREE.MeshStandardMaterial({color:0xb97836,roughness:.92});
const furLight=new THREE.MeshStandardMaterial({color:0xd0944f,roughness:.95});
const furDark=new THREE.MeshStandardMaterial({color:0x7a421f,roughness:.95});
const mask=new THREE.MeshStandardMaterial({color:0x2b211f,roughness:.9});
const black=new THREE.MeshStandardMaterial({color:0x090909,roughness:.42});
const claw=new THREE.MeshStandardMaterial({color:0x3b2a22,roughness:.75});

// pug group: smaller, lower, lying diagonally across cushion
const pug=new THREE.Group();
pug.position.set(-.08,-1.50,.34);
pug.scale.set(.52,.52,.52);
pug.rotation.y=-.48;
scene.add(pug);

// body
const body=new THREE.Mesh(new THREE.SphereGeometry(1.1,48,30),furLight);
body.scale.set(1.46,.70,.88); body.position.set(.55,.12,0); body.castShadow=true; pug.add(body);

// rear haunch
const haunch=new THREE.Mesh(new THREE.SphereGeometry(.76,38,24),fur);
haunch.scale.set(1.0,.88,.9); haunch.position.set(1.18,.07,-.04); haunch.castShadow=true; pug.add(haunch);

// chest/neck
const neck=new THREE.Mesh(new THREE.SphereGeometry(.78,40,24),fur);
neck.scale.set(1.02,.95,.9); neck.position.set(-.47,.28,.03); neck.castShadow=true; pug.add(neck);

// head slightly forward and down, more pug-like
const head=new THREE.Mesh(new THREE.SphereGeometry(.92,48,30),fur);
head.scale.set(1.16,1.05,1.02); head.position.set(-1.18,.34,.22); head.rotation.z=-.08; head.castShadow=true; pug.add(head);

// black face mask
const faceMask=new THREE.Mesh(new THREE.SphereGeometry(.61,40,24),mask);
faceMask.scale.set(1.12,.88,.98); faceMask.position.set(-1.56,.20,.29); faceMask.castShadow=true; pug.add(faceMask);

// cheeks/jowls
for(const z of [.38,.02]){
  const j=new THREE.Mesh(new THREE.SphereGeometry(.33,30,20),mask);
  j.scale.set(1.08,.88,.9); j.position.set(-1.72,.08,z); j.castShadow=true; pug.add(j);
}

// muzzle bridge
const bridge=new THREE.Mesh(new THREE.SphereGeometry(.28,26,18),mask);
bridge.scale.set(1.15,.78,.85); bridge.position.set(-1.85,.28,.21); pug.add(bridge);

// nose
const nose=new THREE.Mesh(new THREE.SphereGeometry(.18,28,18),black);
nose.scale.set(1.25,.76,.78); nose.position.set(-2.08,.28,.31); pug.add(nose);

// ears, floppy
function addEar(z,rz){
  const e=new THREE.Mesh(new THREE.ConeGeometry(.34,.64,3),mask);
  e.position.set(-1.08,.77,z); e.rotation.set(.28,.02,rz); e.castShadow=true; pug.add(e);
}
addEar(.64,.72); addEar(-.22,-.70);

// sleeping eyes as curved tubes
function addEye(z){
  const curve=new THREE.CatmullRomCurve3([
    new THREE.Vector3(-1.62,.40,z-.10),
    new THREE.Vector3(-1.53,.35,z),
    new THREE.Vector3(-1.43,.40,z+.10)
  ]);
  const eye=new THREE.Mesh(new THREE.TubeGeometry(curve,14,.025,8,false),black);
  pug.add(eye);
}
addEye(.52); addEye(.10);

// forehead wrinkles
for(let i=0;i<5;i++){
  const wr=new THREE.Mesh(new THREE.TorusGeometry(.36-i*.025,.024,8,34,Math.PI*.86),furDark);
  wr.scale.set(1.12,.42,1); wr.rotation.z=-.12; wr.rotation.y=.12;
  wr.position.set(-1.25,.72-i*.085,.26); pug.add(wr);
}

// shoulder wrinkles
for(let i=0;i<3;i++){
  const w=new THREE.Mesh(new THREE.TorusGeometry(.44,.026,8,32,Math.PI*.72),furDark);
  w.rotation.x=Math.PI/2; w.rotation.z=.22; w.scale.set(1,.75,1);
  w.position.set(-.15,.38-i*.12,.28); pug.add(w);
}

// front paws stretched forward
function paw(x,z){
  const p=new THREE.Mesh(new THREE.CapsuleGeometry(.21,.72,8,18),fur);
  p.rotation.z=Math.PI/2; p.position.set(x,-.19,z); p.castShadow=true; pug.add(p);
  for(let i=0;i<3;i++){
    const n=new THREE.Mesh(new THREE.SphereGeometry(.036,10,8),claw);
    n.scale.set(1.15,.55,.65); n.position.set(x-.42+i*.08,-.28,z+.10-i*.07); pug.add(n);
  }
}
paw(-.62,.66); paw(-.54,-.42);

// back paw
const rearPaw=new THREE.Mesh(new THREE.CapsuleGeometry(.20,.52,8,18),fur);
rearPaw.rotation.z=Math.PI/2; rearPaw.position.set(1.24,-.21,-.36); rearPaw.castShadow=true; pug.add(rearPaw);

// curled tail
const tailCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(1.53,.42,.02),
  new THREE.Vector3(1.88,.72,.02),
  new THREE.Vector3(1.63,1.02,.02),
  new THREE.Vector3(1.33,.84,.02),
  new THREE.Vector3(1.43,.65,.02)
]);
const tail=new THREE.Mesh(new THREE.TubeGeometry(tailCurve,40,.12,12,false),fur);
tail.castShadow=true; pug.add(tail);

// Z sprites near head
const zSprites=[];
for(let i=0;i<3;i++){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const ctx=c.getContext('2d'); ctx.fillStyle='#d8c9ef'; ctx.font='900 78px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Z',64,64);
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:.65}));
  sp.scale.set(.42+i*.10,.42+i*.10,1); scene.add(sp); zSprites.push(sp);
}

// obstacles stay mostly in upper/mid screen so pug doesn't block side taps
const obstacles=[];
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

const geos={
  bone:new THREE.CapsuleGeometry(.18,.72,8,16),
  can:new THREE.CylinderGeometry(.23,.23,.64,20),
  ball:new THREE.SphereGeometry(.29,20,16),
  asteroid:new THREE.DodecahedronGeometry(.35,1),
  bowl:new THREE.CylinderGeometry(.36,.28,.20,24)
};

function matFor(kind){
  if(kind==='bone') return new THREE.MeshStandardMaterial({color:0xf4d2a1,roughness:.78,emissive:0x3a2208,emissiveIntensity:.12});
  if(kind==='can') return new THREE.MeshStandardMaterial({color:0x357cc8,roughness:.45,metalness:.22});
  if(kind==='ball') return new THREE.MeshStandardMaterial({color:0xf2b72d,roughness:.65});
  if(kind==='bowl') return new THREE.MeshStandardMaterial({color:0xd4483b,roughness:.62});
  return new THREE.MeshStandardMaterial({color:0x6e6d74,roughness:1});
}

function makeObstacle(){
  const kinds=['bone','can','ball','asteroid','bowl'];
  const kind=kinds[Math.floor(Math.random()*kinds.length)];
  const m=new THREE.Mesh(geos[kind],matFor(kind));
  const side=Math.random()<.5?-1:1;

  // Spawn higher and farther from the pug. Target is above pug, giving click room.
  m.position.set(side*(5.8+Math.random()*1.8),1.0+Math.random()*4.8,-.4+Math.random()*2.0);
  m.userData={
    kind,
    life:0,
    speed:.88+Math.random()*.42+score*.016,
    phase:Math.random()*8,
    target:new THREE.Vector3((Math.random()-.5)*1.6,-.88,(Math.random()-.5)*.45)
  };
  if(kind==='bone') m.rotation.z=Math.PI/2;
  if(kind==='can') m.rotation.z=.35;
  m.castShadow=true;
  scene.add(m);
  obstacles.push(m);
}

function removeObstacle(m){
  const i=obstacles.indexOf(m);
  if(i>=0) obstacles.splice(i,1);
  scene.remove(m);
}

function hit(m){
  removeObstacle(m);
  score++;
  scoreEl.textContent=score;
  deadline=Math.min(15,deadline+2.4);
  if(score===1) tipEl.style.opacity=.18;
}

function lose(){
  running=false;
  finalScoreEl.textContent=score;
  gameOverEl.classList.remove('hidden');
}

function reset(){
  for(const o of [...obstacles]) removeObstacle(o);
  score=0;deadline=15;spawnIn=.65;running=true;paused=false;
  scoreEl.textContent='0';pauseBtn.textContent='Ⅱ';
  gameOverEl.classList.add('hidden');tipEl.style.opacity=1;
}

renderer.domElement.addEventListener('pointerdown',e=>{
  if(!running||paused)return;
  pointer.x=(e.clientX/innerWidth)*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(obstacles,false);
  if(hits.length) hit(hits[0].object);
});

pauseBtn.addEventListener('click',()=>{if(!running)return;paused=!paused;pauseBtn.textContent=paused?'▶':'Ⅱ';});
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';});
document.getElementById('restartBtn').addEventListener('click',reset);

function update(dt,t){
  const breathe=1+Math.sin(t*1.45)*.024;
  body.scale.y=.76*breathe;
  neck.scale.y=.95*(1+Math.sin(t*1.45+.25)*.016);
  head.rotation.z=-.08+Math.sin(t*.75)*.010;
  tail.rotation.y=Math.sin(t*.9)*.028;

  zSprites.forEach((sp,i)=>{
    const p=(t*.15+i*.31)%1;
    sp.position.set(-1.78-p*.24,-.35+p*1.52,.65);
    sp.material.opacity=(1-p)*.65;
  });

  if(!running||paused)return;

  deadline-=dt;
  spawnIn-=dt;
  if(spawnIn<=0){
    makeObstacle();
    spawnIn=Math.max(.48,1.32-score*.024)*(.75+Math.random()*.45);
  }

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.userData.life+=dt;
    const dir=o.userData.target.clone().sub(o.position).normalize();
    o.position.addScaledVector(dir,o.userData.speed*dt);
    o.position.y+=Math.sin(t*4+o.userData.phase)*dt*.22;
    o.rotation.x+=dt*1.5;o.rotation.y+=dt*2.0;

    if(o.position.distanceTo(o.userData.target)<1.0 || o.userData.life>8.5){
      removeObstacle(o);
      deadline-=3.0;
    }
  }

  if(deadline<=0){deadline=0;lose()}
  timeEl.textContent=deadline.toFixed(1);
  timeFill.style.transform=`scaleX(${deadline/15})`;
}

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,.05);last=now;
  const t=now/1000;
  update(dt,t);

  // keep composition stable like reference
  camera.position.x=Math.sin(t*.18)*.05;
  camera.position.y=3.1+Math.sin(t*.22)*.03;
  camera.lookAt(0,-.28,0);

  stars.rotation.y+=.00018;
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
