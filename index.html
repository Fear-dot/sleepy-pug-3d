<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sleeping Pets – Prototype v4</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="game-shell">
  <header class="hud">
    <div class="hud-chip">🪙 <strong id="bankCoins">0</strong></div>
    <div class="hud-chip multiplier">×<strong id="multiplier">1</strong></div>
    <div class="hud-chip danger">⏱ <strong id="timer">15.0</strong></div>
    <button id="pauseButton" class="icon-button" aria-label="Pause">Ⅱ</button>
  </header>

  <section id="playfield" class="playfield">
    <div class="room-wall"></div>
    <div class="sofa"></div>
    <div class="sideboard"></div>
    <div class="lamp"></div>
    <div class="rug"></div>

    <canvas id="petImage" width="520" height="360" aria-label="Schlafender Mops"></canvas>

    <div id="itemLayer" class="item-layer"></div>
    <div id="message" class="message">Gold/Blau anklicken. Rot und Fehlklicks wecken ihn!</div>
  </section>

  <section class="status-panel">
    <div class="status-row">
      <span>Aufwach-Leiste</span>
      <strong id="wakePercent">0%</strong>
    </div>
    <div class="wake-track"><div id="wakeFill" class="wake-fill"></div></div>

    <div class="run-stats">
      <div><small>Rundenbeute</small><strong id="runCoins">0 🪙</strong></div>
      <div><small>Serie</small><strong id="combo">0</strong></div>
    </div>

    <button id="bankButton" class="bank-button">Beute sichern</button>
  </section>

  <section class="rules">
    <div><span class="dot gold"></span><b>Gold:</b> Münzen</div>
    <div><span class="dot blue"></span><b>Blau:</b> selten</div>
    <div><span class="dot red"></span><b>Rot:</b> nicht anklicken</div>
    <div><b>Fehlklick ins Spielfeld:</b> sofort wach</div>
  </section>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <h1 id="overlayTitle"></h1>
      <p id="overlayText"></p>
      <button id="overlayButton">Weiter</button>
    </div>
  </div>
</main>

<script defer src="js/config.js"></script>
<script defer src="js/state.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/items.js"></script>
<script defer src="js/main.js"></script>
</body>
</html>
