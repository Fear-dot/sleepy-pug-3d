<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030610">
<title>Sleepy Pug v12</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030610;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 50% 46%,rgba(35,45,90,.28),transparent 36%),#030610}
#stars,#field,.hud{position:fixed;inset:0}
#stars{z-index:0;pointer-events:none;overflow:hidden}
.dot{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.55}
#field{z-index:1;overflow:hidden;touch-action:manipulation}
#pug{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);width:min(78vw,560px);max-height:34vh;object-fit:contain;pointer-events:none;filter:drop-shadow(0 20px 24px #0008)}
.zzz{position:absolute;left:18%;bottom:46%;font-size:34px;font-weight:900;color:#c7a8d5;opacity:.8;pointer-events:none}
.zzz span{display:block}
.zzz span:nth-child(2){margin-left:18px}.zzz span:nth-child(3){margin-left:36px}
.obj{position:absolute;z-index:2;width:64px;height:64px;display:grid;place-items:center;font-size:44px;user-select:none;-webkit-user-select:none;touch-action:manipulation;filter:drop-shadow(0 7px 9px #0007)}
.hud{z-index:5;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
.top{display:grid;grid-template-columns:1fr 1.06fr 1fr;gap:10px}
.panel{background:rgba(6,10,20,.92);border:1px solid rgba(255,255,255,.17);border-radius:20px;box-shadow:0 8px 24px #0008,inset 0 1px rgba(255,255,255,.05)}
.score,.houses{height:76px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900}.score .icon{font-size:28px}.num{font-size:25px}.label{display:block;font-size:9px;color:#9ee7ff;letter-spacing:.12em}
.timer{height:76px;padding:10px;text-align:center;font-size:25px;font-weight:900}.bar{height:8px;background:#171d2c;border:1px solid #30384c;border-radius:99px;overflow:hidden;margin-top:6px}.bar>div{height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#248fff,#4be3df)}
.houses{flex-direction:column;gap:2px}.houses .icons{font-size:20px}
.tip{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);width:min(410px,78vw);padding:11px 17px;text-align:center;background:rgba(7,10,21,.86);border:1px solid rgba(255,255,255,.08);border-radius:28px;font-size:12px;font-weight:800}
.ctrl{pointer-events:auto;position:absolute;bottom:max(22px,env(safe-area-inset-bottom));height:62px;border:1px solid rgba(255,255,255,.15);background:rgba(7,10,21,.92);color:#fff;box-shadow:0 8px 22px #0008}.pause,.sound{width:62px;border-radius:50%;font-size:26px;font-weight:900}.pause{left:22px}.sound{right:22px}
.mode{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);height:62px;min-width:220px;padding:0 20px;display:flex;align-items:center;justify-content:center;border-radius:30px;font-size:17px;font-weight:900}.ver{font-size:9px;opacity:.45;margin-left:5px}
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#030610d9;backdrop-filter:blur(10px)}.hidden{display:none}.card{width:min(350px,90vw);padding:26px;text-align:center;border-radius:26px;background:#090e1e;border:1px solid #ffffff29}.btn{border:0;border-radius:16px;padding:13px 20px;font-weight:900}
</style>
</head>
<body>
<div id="stars"></div>
<div id="field">
  <div class="zzz"><span>Z</span><span>Z</span><span>Z</span></div>
  <img id="pug" src="./sleeping-pug-cutout.png?v=12" alt="Schlafender Mops">
</div>

<div class="hud">
  <div class="top">
    <div class="panel score"><span class="icon">⭐</span><div><span class="num" id="score">0</span><span class="label">PUNKTE</span></div></div>
    <div class="panel timer">⏱ <span id="time">15.0</span><div class="bar"><div id="fill"></div></div></div>
    <div class="panel houses"><div class="icons">🏠 🏠 🏠</div><span class="label">HÄUSER</span></div>
  </div>
  <div class="tip">Tippe die fliegenden Dinge an,<br>bevor sie den Mops erreichen.</div>
  <button class="ctrl pause" id="pause">Ⅱ</button>
  <div class="panel mode">❤️ 🐶 Mops‑Modus <span class="ver">v12</span></div>
  <button class="ctrl sound" id="sound">🔊</button>
</div>

<div id="over" class="overlay hidden">
  <div class="card"><div style="font-size:54px">😳</div><h2>Der Mops ist wach!</h2><p><b id="final">0</b> Punkte</p><button class="btn" id="again">Nochmal spielen</button></div>
</div>

<script>
(function(){
  var score=0, time=15, paused=false, running=true;
  var field=document.getElementById('field');
  var scoreEl=document.getElementById('score');
  var timeEl=document.getElementById('time');
  var fill=document.getElementById('fill');
  var over=document.getElementById('over');
  var finalEl=document.getElementById('final');
  var pause=document.getElementById('pause');
  var sound=document.getElementById('sound');
  var symbols=['🦴','⭐','🥫','🥣','🪨'];

  var stars=document.getElementById('stars');
  for(var i=0;i<220;i++){
    var d=document.createElement('i');d.className='dot';
    d.style.left=(Math.random()*100)+'%';d.style.top=(Math.random()*100)+'%';
    d.style.opacity=(.2+Math.random()*.7);d.style.transform='scale('+(0.6+Math.random()*1.6)+')';
    stars.appendChild(d);
  }

  function ui(){
    if(time<0) time=0;
    timeEl.textContent=time.toFixed(1);
    fill.style.transform='scaleX('+(time/15)+')';
  }

  function spawn(){
    if(!running||paused)return;
    var o=document.createElement('div');
    o.className='obj';o.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    var side=Math.floor(Math.random()*3), sx,sy;
    if(side===0){sx=-70;sy=innerHeight*(.18+Math.random()*.42);}
    else if(side===1){sx=innerWidth+70;sy=innerHeight*(.18+Math.random()*.42);}
    else{sx=innerWidth*(.08+Math.random()*.84);sy=-70;}
    var tx=innerWidth*(.45+Math.random()*.10),ty=innerHeight*.69;
    o.style.left=sx+'px';o.style.top=sy+'px';
    field.appendChild(o);

    o.addEventListener('pointerdown',function(e){
      e.preventDefault();
      if(!running||paused)return;
      score++;scoreEl.textContent=score;time=Math.min(15,time+2.2);ui();
      o.remove();
    },{once:true});

    requestAnimationFrame(function(){
      var duration=Math.max(2.8,5.3-score*.025);
      o.style.transition='left '+duration+'s linear, top '+duration+'s linear, transform '+duration+'s linear';
      o.style.left=tx+'px';o.style.top=ty+'px';o.style.transform='rotate(540deg)';
      setTimeout(function(){
        if(o.isConnected){
          o.remove();
          if(running&&!paused){time-=2.8;ui();if(time<=0)end();}
        }
      },duration*1000);
    });
  }

  function end(){running=false;finalEl.textContent=score;over.classList.remove('hidden');}
  function reset(){
    document.querySelectorAll('.obj').forEach(function(x){x.remove()});
    score=0;time=15;paused=false;running=true;scoreEl.textContent='0';pause.textContent='Ⅱ';over.classList.add('hidden');ui();
  }

  pause.addEventListener('click',function(){if(!running)return;paused=!paused;pause.textContent=paused?'▶':'Ⅱ';});
  sound.addEventListener('click',function(){sound.textContent=sound.textContent==='🔊'?'🔇':'🔊';});
  document.getElementById('again').addEventListener('click',reset);

  setInterval(function(){
    if(!running||paused)return;
    time-=0.1;ui();
    if(time<=0)end();
  },100);

  setInterval(spawn,1050);
  setTimeout(spawn,350);
  ui();
})();
</script>
</body>
</html>
