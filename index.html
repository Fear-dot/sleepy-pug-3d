<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#16131d" />
  <title>Sleepy Pug – 3D Prototype</title>
  <style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #16131d;
  font-family: Inter, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;
  touch-action: none;
}
#game { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; }

.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  padding: max(16px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}
.topbar {
  display: grid;
  grid-template-columns: 72px 1fr 48px;
  gap: 10px;
  align-items: center;
}
.title {
  text-align: center;
  font-weight: 900;
  letter-spacing: .12em;
  font-size: clamp(15px, 4vw, 19px);
  text-shadow: 0 2px 10px rgba(0,0,0,.35);
}
.pill {
  height: 44px;
  min-width: 68px;
  padding: 0 12px;
  border-radius: 999px;
  background: rgba(22,19,29,.68);
  backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
}
.iconBtn, .mainBtn {
  pointer-events: auto;
  border: 0;
  color: white;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.iconBtn {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  background: rgba(22,19,29,.68);
  backdrop-filter: blur(14px);
  font-size: 20px;
}
.sleep-meter-wrap {
  width: min(430px, calc(100vw - 32px));
  margin: 12px auto 0;
  background: rgba(22,19,29,.58);
  border-radius: 18px;
  padding: 10px 13px 12px;
  backdrop-filter: blur(14px);
  box-shadow: 0 8px 24px rgba(0,0,0,.16);
}
.label-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 800;
  opacity: .92;
  margin-bottom: 6px;
}
.meter {
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,.12);
  overflow: hidden;
}
.meter-fill {
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #f59e0b, #facc15, #8bffb0);
  transform-origin: left center;
}
.tip {
  margin: auto auto 92px;
  width: min(420px, calc(100vw - 42px));
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(22,19,29,.58);
  backdrop-filter: blur(10px);
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,.16);
  transition: opacity .4s ease;
}
.bottom {
  position: absolute;
  left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom));
  text-align: center;
}
.mainBtn {
  min-width: 150px;
  padding: 13px 22px;
  border-radius: 18px;
  font-weight: 900;
  font-size: 15px;
  background: rgba(255,255,255,.16);
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,12,20,.58);
  backdrop-filter: blur(10px);
  display: grid;
  place-items: center;
  padding: 24px;
}
.hidden { display: none; }
.card {
  width: min(360px, 92vw);
  border-radius: 30px;
  padding: 28px;
  text-align: center;
  background: rgba(36,31,46,.9);
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 30px 90px rgba(0,0,0,.45);
}
.card .big { font-size: 56px; }
.card h1 { margin: 8px 0 6px; font-size: 25px; }
.card p { margin: 0 0 20px; opacity: .85; }

</style>
</head>
<body>
  <div id="game"></div>

  <div class="hud">
    <div class="topbar">
      <div class="pill"><span>🌙</span><b id="score">0</b></div>
      <div class="title">SLEEPY PUG</div>
      <button id="soundBtn" class="iconBtn" aria-label="Sound">🔊</button>
    </div>

    <div class="sleep-meter-wrap">
      <div class="label-row">
        <span>Schlaf</span>
        <span id="sleepText">100%</span>
      </div>
      <div class="meter"><div id="sleepFill" class="meter-fill"></div></div>
    </div>

    <div class="tip" id="tip">Tippe auf die schwebenden Störer, bevor der Mops aufwacht.</div>

    <div class="bottom">
      <button id="restartBtn" class="mainBtn">Neu starten</button>
    </div>
  </div>

  <div id="gameOver" class="overlay hidden">
    <div class="card">
      <div class="big">😳</div>
      <h1>Der Mops ist wach!</h1>
      <p>Du hast <b id="finalScore">0</b> Störer beseitigt.</p>
      <button id="overlayRestartBtn" class="mainBtn">Nochmal</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';

const mount = document.getElementById('game');
const scoreEl = document.getElementById('score');
const sleepText = document.getElementById('sleepText');
const sleepFill = document.getElementById('sleepFill');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');
const tipEl = document.getElementById('tip');

let score = 0;
let sleep = 100;
let running = true;
let lastTime = performance.now();
let nextSpawn = 1.5;
let soundOn = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16131d);
scene.fog = new THREE.FogExp2(0x16131d, 0.035);

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 5.2, 10.6);
camera.lookAt(0, 1.15, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xb9c8ff, 0x493527, 2.0));
const moonLight = new THREE.DirectionalLight(0xcbd6ff, 4.0);
moonLight.position.set(-4, 8, 4);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(1024, 1024);
scene.add(moonLight);

const warm = new THREE.PointLight(0xffaa66, 18, 8, 2);
warm.position.set(3.4, 2.8, 2.8);
scene.add(warm);

// Room floor
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7.5, 64),
  new THREE.MeshStandardMaterial({ color: 0x3b3146, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Rug
const rug = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 64),
  new THREE.MeshStandardMaterial({ color: 0x694b66, roughness: 1 })
);
rug.scale.set(1.35, 1, .72);
rug.rotation.x = -Math.PI / 2;
rug.position.y = 0.015;
rug.receiveShadow = true;
scene.add(rug);

// Moon decoration
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(.75, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0xffefb8, emissive: 0x493914, emissiveIntensity: .7 })
);
moon.position.set(-4.1, 5.0, -2.6);
scene.add(moon);

// Bed
const bed = new THREE.Group();
const mattress = new THREE.Mesh(
  new THREE.BoxGeometry(5.4, .62, 3.6),
  new THREE.MeshStandardMaterial({ color: 0xdab6a8, roughness: .9 })
);
mattress.position.y = .62;
mattress.castShadow = mattress.receiveShadow = true;
bed.add(mattress);

const blanket = new THREE.Mesh(
  new THREE.BoxGeometry(5.15, .20, 2.05),
  new THREE.MeshStandardMaterial({ color: 0x8d6aa7, roughness: .95 })
);
blanket.position.set(.1, .98, -.68);
blanket.castShadow = true;
bed.add(blanket);

const pillow = new THREE.Mesh(
  new THREE.SphereGeometry(1, 32, 18),
  new THREE.MeshStandardMaterial({ color: 0xf0d7c9, roughness: .95 })
);
pillow.scale.set(1.15, .26, .72);
pillow.position.set(-1.9, 1.02, .6);
pillow.castShadow = true;
bed.add(pillow);

scene.add(bed);

// Pug made from procedural 3D primitives
const pug = new THREE.Group();
pug.position.set(-.25, 1.1, .25);
pug.rotation.y = -.12;
scene.add(pug);

const fur = new THREE.MeshStandardMaterial({ color: 0xc7a277, roughness: .92 });
const dark = new THREE.MeshStandardMaterial({ color: 0x2c2727, roughness: .9 });
const noseMat = new THREE.MeshStandardMaterial({ color: 0x131112, roughness: .45 });
const pink = new THREE.MeshStandardMaterial({ color: 0xb66f76, roughness: .8 });

const body = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 24), fur);
body.scale.set(1.55, .78, .95);
body.position.set(.35, .22, 0);
body.castShadow = true;
pug.add(body);

const head = new THREE.Mesh(new THREE.SphereGeometry(.82, 36, 24), fur);
head.scale.set(1.02, .9, .9);
head.position.set(-1.0, .45, .08);
head.rotation.z = -.2;
head.castShadow = true;
pug.add(head);

const muzzle = new THREE.Mesh(new THREE.SphereGeometry(.44, 32, 20), dark);
muzzle.scale.set(1.05, .68, .72);
muzzle.position.set(-1.58, .29, .15);
muzzle.castShadow = true;
pug.add(muzzle);

const nose = new THREE.Mesh(new THREE.SphereGeometry(.18, 24, 16), noseMat);
nose.scale.set(1.25, .72, .7);
nose.position.set(-1.95, .42, .16);
pug.add(nose);

function ear(x, z, rotZ) {
  const e = new THREE.Mesh(new THREE.ConeGeometry(.28, .52, 3), dark);
  e.position.set(x, .91, z);
  e.rotation.set(.1, 0, rotZ);
  e.castShadow = true;
  pug.add(e);
}
ear(-1.30, .52, .45);
ear(-.68, -.36, -.65);

function closedEye(x, z) {
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(x - .14, .54, z),
    new THREE.Vector3(x, .49, z + .02),
    new THREE.Vector3(x + .14, .54, z),
  ]);
  const geo = new THREE.TubeGeometry(curve, 12, .025, 8, false);
  const m = new THREE.Mesh(geo, noseMat);
  pug.add(m);
}
closedEye(-1.49, .47);
closedEye(-1.35, -.18);

const leg1 = new THREE.Mesh(new THREE.CapsuleGeometry(.22, .62, 8, 16), fur);
leg1.rotation.z = Math.PI / 2;
leg1.position.set(.5, -.24, .58);
leg1.castShadow = true;
pug.add(leg1);

const leg2 = leg1.clone();
leg2.position.set(.2, -.27, -.58);
pug.add(leg2);

// Curled tail
const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(1.45, .4, 0),
  new THREE.Vector3(1.9, .75, 0),
  new THREE.Vector3(1.65, 1.08, 0),
  new THREE.Vector3(1.28, .88, 0),
]);
const tail = new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 30, .12, 12, false), fur);
tail.castShadow = true;
pug.add(tail);

// Zzz particles
const zzz = [];
for (let i = 0; i < 3; i++) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 128;
  const c = canvas.getContext('2d');
  c.fillStyle = 'white';
  c.font = 'bold 80px sans-serif';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText('Z', 64, 64);
  const tex = new THREE.CanvasTexture(canvas);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: .8 }));
  sp.scale.set(.48 + i*.12, .48 + i*.12, 1);
  scene.add(sp);
  zzz.push(sp);
}

const disturbers = [];
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const geoMap = {
  ball: new THREE.SphereGeometry(.32, 18, 14),
  clock: new THREE.TorusGeometry(.28, .09, 10, 24),
  snack: new THREE.BoxGeometry(.48, .32, .18)
};

function spawnDisturber() {
  const kinds = ['ball','clock','snack'];
  const kind = kinds[Math.floor(Math.random()*kinds.length)];
  const colors = [0xff7f7f, 0x75c9ff, 0xffd166, 0x8cffb0];
  const mat = new THREE.MeshStandardMaterial({
    color: colors[Math.floor(Math.random()*colors.length)],
    emissive: 0x25111c,
    emissiveIntensity: .2,
    roughness: .6
  });
  const mesh = new THREE.Mesh(geoMap[kind], mat);
  const side = Math.random() < .5 ? -1 : 1;
  mesh.position.set(side * (3.8 + Math.random()*1.4), 1.6 + Math.random()*3.4, -1.2 + Math.random()*3.8);
  mesh.userData = {
    life: 0,
    speed: .55 + Math.random()*.45 + score*.012,
    phase: Math.random()*10,
    targetX: -.6 + Math.random()*1.2
  };
  mesh.castShadow = true;
  scene.add(mesh);
  disturbers.push(mesh);
}

function pop(mesh) {
  const i = disturbers.indexOf(mesh);
  if (i >= 0) disturbers.splice(i, 1);
  scene.remove(mesh);
  score++;
  scoreEl.textContent = score;
  sleep = Math.min(100, sleep + 4);
  if (score === 1) tipEl.style.opacity = .25;
}

function onTap(clientX, clientY) {
  if (!running) return;
  pointer.x = (clientX / innerWidth) * 2 - 1;
  pointer.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(disturbers, false);
  if (hits.length) pop(hits[0].object);
}

renderer.domElement.addEventListener('pointerdown', e => onTap(e.clientX, e.clientY));

function reset() {
  for (const d of [...disturbers]) scene.remove(d);
  disturbers.length = 0;
  score = 0;
  sleep = 100;
  nextSpawn = .9;
  running = true;
  scoreEl.textContent = '0';
  gameOverEl.classList.add('hidden');
  tipEl.style.opacity = 1;
}

function gameOver() {
  running = false;
  finalScoreEl.textContent = score;
  gameOverEl.classList.remove('hidden');
}

document.getElementById('restartBtn').addEventListener('click', reset);
document.getElementById('overlayRestartBtn').addEventListener('click', reset);
document.getElementById('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
});

function update(dt, t) {
  // sleepy breathing
  const breath = 1 + Math.sin(t*1.5)*.025;
  body.scale.y = .78 * breath;
  head.rotation.z = -.2 + Math.sin(t*.7)*.012;

  // zzz
  zzz.forEach((sp, i) => {
    const p = (t*.16 + i*.28) % 1;
    sp.position.set(-2.1 - p*.25, 2.05 + p*1.7, .75);
    sp.material.opacity = (1-p) * .78;
  });

  if (!running) return;

  sleep -= dt * (2.2 + Math.min(score, 25)*.03);
  nextSpawn -= dt;
  if (nextSpawn <= 0) {
    spawnDisturber();
    nextSpawn = Math.max(.62, 1.55 - score*.025) * (.75 + Math.random()*.45);
  }

  for (let i = disturbers.length - 1; i >= 0; i--) {
    const d = disturbers[i];
    d.userData.life += dt;
    const dir = new THREE.Vector3(d.userData.targetX - d.position.x, 1.35 - d.position.y, .15 - d.position.z).normalize();
    d.position.addScaledVector(dir, d.userData.speed * dt);
    d.position.y += Math.sin(t*4 + d.userData.phase) * dt * .22;
    d.rotation.x += dt*1.8;
    d.rotation.y += dt*2.2;

    if (d.position.distanceTo(new THREE.Vector3(0,1.3,.1)) < 1.55 || d.userData.life > 8.5) {
      scene.remove(d);
      disturbers.splice(i,1);
      sleep -= 13;
    }
  }

  if (sleep <= 0) {
    sleep = 0;
    gameOver();
  }
  sleepText.textContent = `${Math.round(sleep)}%`;
  sleepFill.style.transform = `scaleX(${sleep/100})`;
}

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime)/1000, .05);
  lastTime = now;
  const t = now/1000;
  update(dt, t);

  // gentle camera float
  camera.position.x = Math.sin(t*.22)*.12;
  camera.position.y = 5.2 + Math.sin(t*.31)*.08;
  camera.lookAt(0,1.15,0);

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
</html>
